name: ArtCore CD

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build App 
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    env:
      IMAGE_URI: ${{ secrets.TEST_REPO }}
      TAG_NAME: "v1"

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image
        run: |
          docker build --target base -t $IMAGE_URI:$TAG_NAME .
          docker tag $IMAGE_URI:$TAG_NAME $IMAGE_URI:latest

      - name: Push image
        run: |
          docker push $IMAGE_URI:$TAG_NAME
          docker push $IMAGE_URI:latest

      - name: Deploy to Server
        uses: fifsky/ssh-action@master
        with:
          command: |
            # Login to ACR from the server using a service principal / ACR token
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} --username "${{ secrets.ACR_USERNAME }}" --password-stdin
            cd api
            docker-compose pull backend
            docker-compose -f docker-compose.yml down backend
            docker-compose -f docker-compose.yml up -d backend
            docker system prune -f # Purge system (by force) to free up space
          host: ${{ secrets.AZ_SSH_HOST }}
          user: ${{ secrets.AZ_SSH_USER }}
          key: ${{ secrets.AZ_SSH_PASSWORD }}
