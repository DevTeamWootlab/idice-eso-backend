name: Azure Production Delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idice_ci
          POSTGRES_PASSWORD: idice_ci_password
          POSTGRES_DB: idice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idice_ci -d idice_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: yarn test --runInBand --ci

      - name: Build
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: idice-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production container
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: idice-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Prove compiled migrations on a fresh PostgreSQL 16 database
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: idice_ci
          DB_PASSWORD: idice_ci_password
          DB_NAME: idice_ci
        run: yarn db:migrate:prod

      - name: Dependency audit
        run: yarn audit --groups dependencies --level high

      - name: Scan repository for vulnerabilities
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy staging slot and swap
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ format('{0}.azurecr.io', vars.AZURE_ACR_NAME) }}
      IMAGE_NAME: idice-api
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure deployment settings
        run: |
          set -euo pipefail
          for name in AZURE_RESOURCE_GROUP AZURE_APP_SERVICE_NAME AZURE_ACR_NAME AZURE_ACR_LOGIN_SERVER; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub environment variable: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Block deployments without a full schema baseline
        run: node scripts/validate-migration-baseline.mjs

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          auth-type: OIDC
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$AZURE_ACR_NAME"

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ format('{0}.azurecr.io/idice-api:{1}', vars.AZURE_ACR_NAME, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan production image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ format('{0}.azurecr.io/idice-api:{1}', vars.AZURE_ACR_NAME, github.sha) }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure staging slot image
        run: >-
          az webapp config container set
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_APP_SERVICE_NAME"
          --slot staging
          --docker-custom-image-name "$AZURE_ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          --docker-registry-server-url "https://$AZURE_ACR_LOGIN_SERVER"

      - name: Stamp the release version on the staging slot
        run: >-
          az webapp config appsettings set
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_APP_SERVICE_NAME"
          --slot staging
          --settings APP_VERSION="$IMAGE_TAG"

      - name: Restart staging slot to run migrations and seed reference data
        run: az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_SERVICE_NAME" --slot staging

      - name: Wait for database and migration readiness
        env:
          HEALTH_URL: https://${{ vars.AZURE_APP_SERVICE_NAME }}-staging.azurewebsites.net/api/v1/health/ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            response="$(curl --silent --show-error --fail "$HEALTH_URL" || true)"
            if RESPONSE="$response" node -e 'const r=JSON.parse(process.env.RESPONSE||"{}"); process.exit(r.data?.database_connected === true && r.data?.migrations_pending === false && r.data?.status === "UP" ? 0 : 1)' 2>/dev/null; then
              echo "Staging reports healthy, connected to PostgreSQL, and fully migrated."
              exit 0
            fi
            echo "Waiting for staging startup/migrations ($attempt/36)."
            sleep 10
          done
          echo "Staging failed readiness or migration verification; production slot was not swapped."
          az webapp log tail --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_SERVICE_NAME" --slot staging || true
          exit 1

      - name: Smoke-test staging endpoints and validate routes
        env:
          API_URL: https://${{ vars.AZURE_APP_SERVICE_NAME }}-staging.azurewebsites.net/api/v1
          EXPECTED_APP_VERSION: ${{ github.sha }}
          SYSADMIN_SEED_EMAIL: ${{ vars.SYSADMIN_SEED_EMAIL }}
          SYSADMIN_SEED_PASSWORD: ${{ secrets.SYSADMIN_SEED_PASSWORD }}
        run: node scripts/check-deployed-routes.mjs

      - name: Swap staging into production
        run: az webapp deployment slot swap --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_SERVICE_NAME" --slot staging --target-slot production

      - name: Verify production and roll back on failure
        env:
          HEALTH_URL: https://${{ vars.AZURE_APP_SERVICE_NAME }}.azurewebsites.net/api/v1/health/ready
          API_URL: https://${{ vars.AZURE_APP_SERVICE_NAME }}.azurewebsites.net/api/v1
          EXPECTED_APP_VERSION: ${{ github.sha }}
          SYSADMIN_SEED_EMAIL: ${{ vars.SYSADMIN_SEED_EMAIL }}
          SYSADMIN_SEED_PASSWORD: ${{ secrets.SYSADMIN_SEED_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --fail "$HEALTH_URL" || true)"
            if RESPONSE="$response" node -e 'const r=JSON.parse(process.env.RESPONSE||"{}"); process.exit(r.data?.database_connected === true && r.data?.migrations_pending === false && r.data?.status === "UP" && r.data?.version === process.env.EXPECTED_APP_VERSION ? 0 : 1)' 2>/dev/null; then
              echo "Production health and migration checks passed."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Production readiness failed; swapping the previous deployment back."
              az webapp deployment slot swap --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_SERVICE_NAME" --slot staging --target-slot production
              exit 1
            fi
            sleep 10
          done
          if node scripts/check-deployed-routes.mjs; then
            echo "Production endpoint smoke tests and route validation passed."
          else
            echo "Production endpoint or route validation failed; swapping the previous deployment back."
            az webapp deployment slot swap --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_SERVICE_NAME" --slot staging --target-slot production
            exit 1
          fi
